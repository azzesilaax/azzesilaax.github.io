<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Music Survey</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 60px;
            font-weight: bold;
        }
        fieldset {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            width: 400px;
        }
        legend {
            font-weight: bold;
        }
        .checkbox-group label, .radio-group label {
            display: inline;
            font-weight: normal;
        }
        textarea {
            display: block;
            margin-top: 5px;
        }
        .buttons {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Music Survey</h1>

    <form action="http://www.uyar.com/teaching/ecc006/2017spring/login.php" method="POST">
        
        <div class="form-group">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name">
        </div>

        <div class="form-group">
            <label for="email">E-Mail:</label><br>
            <input type="email" id="email" name="email">
        </div>

        <fieldset class="checkbox-group">
            <legend>Select Your Favorite Types of Music:</legend>
            <input type="checkbox" id="pop" name="music_type" value="pop">
            <label for="pop">Pop</label><br>
            
            <input type="checkbox" id="classical" name="music_type" value="classical">
            <label for="classical">Classical</label><br>
            
            <input type="checkbox" id="rock" name="music_type" value="rock">
            <label for="rock">Rock</label><br>
            
            <input type="checkbox" id="folk" name="music_type" value="folk">
            <label for="folk">Folk</label><br>
            
            <input type="checkbox" id="rap" name="music_type" value="rap">
            <label for="rap">Rap</label><br>
            
            <input type="checkbox" id="other" name="music_type" value="other">
            <label for="other">Other</label>
        </fieldset>

        <fieldset class="radio-group">
            <legend>Select how often you purchase Music CDs:</legend>
            <input type="radio" id="weekly" name="purchase_freq" value="weekly">
            <label for="weekly">Weekly</label><br>
            
            <input type="radio" id="few_year" name="purchase_freq" value="few_year" checked>
            <label for="few_year">A few CDs each year</label><br>
            
            <input type="radio" id="monthly" name="purchase_freq" value="monthly">
            <label for="monthly">Monthly</label><br>
            
            <input type="radio" id="never" name="purchase_freq" value="never">
            <label for="never">Never purchase</label>
        </fieldset>

        <div class="form-group">
            <label for="locations" style="width: auto;">Select the locations you listen to Music:</label><br>
            <select id="locations" name="locations" size="3" style="width: 250px;">
                <option value="home" selected>At home</option>
                <option value="car">In the car</option>
                <option value="anywhere">Anywhere (MP3 Player)</option>
                <option value="concert">At concerts</option> </select>
        </div>

        <div class="form-group">
            <label for="role" style="width: auto;">What role does music play in your life?</label>
            <textarea id="role" name="music_role" cols="60" rows="3"></textarea>
        </div>

        <div class="buttons">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>

    </form>

</body>
</html>
